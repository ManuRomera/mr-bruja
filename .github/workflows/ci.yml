name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: El zip lleva lo importante (tours, fuentes, arte)
        run: |
          for f in tours/empezar.json fonts/imfe-gprm.otf assets/art/brand/cover.webp lang/es.json; do unzip -l dist/mr-bruja.zip | grep -q "$f" || { echo "Falta $f en el zip"; exit 1; }; done
